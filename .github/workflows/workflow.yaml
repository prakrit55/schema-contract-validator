name: Deploy Services

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ""
  GCP_REGION: "us-central1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          fail-on-leak: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Format Check (Black)
        run: black --check .

      - name: Run Linter (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Init & Validate
        run: |
          cd bigquerydataset
          tofu init -backend=false
          tofu validate

      - name: Authenticate to Google Cloud Platform
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/898698082979/locations/global/workloadIdentityPools/github-deployer/providers/github-prakrit55-v2'
          service_account: 'github-actions-deployer@k8s-staging-252732.iam.gserviceaccount.com'

      - name: Set up Google Cloud Platform Software Development Kit
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Data Loader Dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Student Dataset Schema
        run: |
          python validatordcyn/serialiser.py datasets

      - name: Convert Dataset to NDJSON Format
        run: |
          for f in datasets/*.json; do
            python validatordcyn/convert_ndjson.py "$f" "${f%.json}.ndjson"
          done

      - name: Upload Dataset to GCS Raw Landing
        run: |
          for f in datasets/*.ndjson; do
            gcloud storage cp "$f" "gs://bigquery-d0-raw-landing-prod-k8s-staging-252732/landing/$(basename "$f")"
          done

      - name: Load Dataset into BigQuery Table
        run: |
          for f in datasets/*.ndjson; do
            table_name=$(basename "$f" .ndjson)
            bq load --source_format=NEWLINE_DELIMITED_JSON d1_staged_enforced_prod."$table_name" "gs://bigquery-d0-raw-landing-prod-k8s-staging-252732/landing/$(basename "$f")"
          done

